version: 0.0
os: linux
files:
  # GitLab 저장소 내의 소스 파일들을 target EC2의 nginx 웹 루트 디렉토리로 복사합니다.
  - source: /src/html
    destination: /var/www/blog.techflow.local/html
    overwrite: yes

permissions:
  # 복사된 파일들이 웹 서버(nginx) 환경에서 잘 읽히도록 권한을 설정합니다.
  - object: /var/www/blog.techflow.local/
    pattern: "**"
    owner: nginx     # 만약 Amazon Linux라면 ec2-user 등으로 수정 가능
    group: nginx      # nginx가 읽을 수 있도록 그룹 지정
    mode: 644
    type:
      - file

hooks:
  # 1. 파일이 복사되기 전: 기존 디렉토리가 꼬이지 않도록 정리하거나 백업 스크립트를 실행할 수 있습니다. (필요 시)
  BeforeInstall:
    - location: scripts/clean_release.sh
      timeout: 60
      runas: root

  # 2. 파일 복사가 완료된 후: Nginx 서버를 재시작(Reload)하여 변경 사항을 바로 반영합니다.
  ApplicationStart:
    - location: scripts/reload_nginx.sh
      timeout: 60
      runas: root
