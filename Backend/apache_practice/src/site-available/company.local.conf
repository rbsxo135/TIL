<VirtualHost *:80>
    ServerAdmin admin@company.local
    ServerName company.local
    ServerAlias www.company.local
    
    DocumentRoot /var/www/company.local/public_html
    
    <Directory /var/www/company.local/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog /var/www/company.local/logs/error.log
    CustomLog /var/www/company.local/logs/access.log combined
</VirtualHost>
