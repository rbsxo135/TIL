<VirtualHost *:80>
    ServerAdmin admin@blog.resume.local
    ServerName blog.resume.local
    ServerAlias www.blog.resume.local

	Redirect permanent / https://blog.resume.local
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin admin@blog.resume.local
    ServerName blog.resume.local
    ServerAlias www.blog.resume.local
    
    DocumentRoot /var/www/blog.resume.local/public_html
    
	Protocols h2 http/1.1

	SSLEngine on
	SSLCertificateFile /etc/apache2/ssl/blog.resume.local.crt
	SSLCErtificateKeyFile /etc/apache2/ssl/blog.resume.local.key

	SSLProtocol		all -SSLv3 -TLSv1 -TLSv1.1 +TLSv1.2 +TLSv1.3
	SSLHonorCipherOrder	on
	SSLCipherSuite	ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256

	# ----------------------------------------------------------
    # 보안 헤더 설정 (mod_headers 필요)
    # ----------------------------------------------------------
    # HSTS 설정
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    # 클릭재킹 방지
    Header always set X-Frame-Options "SAMEORIGIN"
    # MIME 스니핑 방지
    Header always set X-Content-Type-Options "nosniff"
    # XSS 필터
    Header always set X-XSS-Protection "1; mode=block"

    # ----------------------------------------------------------
    # 디렉토리 및 WordPress 설정
    # ----------------------------------------------------------
    <Directory /var/www/blog.resume.local/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # WordPress 고유주소(Permalink) 리라이트 규칙
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.php$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.php [L]
        </IfModule>
    </Directory>

    # ----------------------------------------------------------
    # PHP-FPM 연동 (FPM 소켓 경로 확인 필요)
    # ----------------------------------------------------------
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # ----------------------------------------------------------
    # 보안: 민감한 파일 접근 차단
    # ----------------------------------------------------------
    # .ht로 시작하는 파일 보호 (.htaccess 등)
    <FilesMatch "^\.ht">
        Require all denied
    </FilesMatch>

    # wp-config.php 파일 보호
    <FilesMatch "wp-config\.php">
        Require all denied
    </FilesMatch>

    # 업로드 폴더 내 PHP 실행 차단 (업로드 공격 방지)
    <Directory /var/www/blog.resume.local/public_html/wp-content/uploads>
        <FilesMatch \.php$>
            Require all denied
        </FilesMatch>
    </Directory>

    # ----------------------------------------------------------
    # 성능: 정적 파일 브라우저 캐싱 (mod_expires 필요)
    # ----------------------------------------------------------
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 30 days"
        ExpiresByType image/jpeg "access plus 30 days"
        ExpiresByType image/png "access plus 30 days"
        ExpiresByType image/gif "access plus 30 days"
        ExpiresByType image/ico "access plus 30 days"
        ExpiresByType image/svg+xml "access plus 30 days"
        ExpiresByType text/css "access plus 30 days"
        ExpiresByType application/javascript "access plus 30 days"
        ExpiresByType font/woff "access plus 30 days"
        ExpiresByType font/woff2 "access plus 30 days"
        
        # Cache-Control 헤더 추가
        Header set Cache-Control "public, immutable"
    </IfModule>

    ErrorLog /var/www/blog.resume.local/logs/error.log
    CustomLog /var/www/blog.resume.local/logs/access.log combined
</VirtualHost>
