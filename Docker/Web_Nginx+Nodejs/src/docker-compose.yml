services:
  redis:
    image: redis:7-alpine
    container_name: redis-persist
    expose:
      - "6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network
  
  backend1:
    build: ./backend
    container_name: backend1
    environment:
      - REDIS_HOST=redis
      - NODE_NAME=backend1
    networks:
      - app-network
    # 내부 통신만 사용, 외부 포트 노출 안 함
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend2:
    build: ./backend
    container_name: backend2
    networks:
      - app-network
    environment:
      - REDIS_HOST=redis
      - NODE_NAME=backend2
    # 내부 통신만 사용, 외부 포트 노출 안 함
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend3:
    build: ./backend
    container_name: backend3
    networks:
      - app-network
    environment:
      - REDIS_HOST=redis
      - NODE_NAME=backend3
    # 내부 통신만 사용, 외부 포트 노출 안 함
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  
